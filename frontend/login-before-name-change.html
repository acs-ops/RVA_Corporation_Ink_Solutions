<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Romeo V Austria Corporation</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >

    <!-- Main CSS -->
    <link rel="stylesheet" href="css/style.css">

</head>

<body>


<!-- =========================================================
     HEADER
     ========================================================= -->

<header class="top-header">

    <div class="container header-container">

        <div class="logo-area">

            <img
                src="images/logo/logo.jpg"
                alt="Romeo V Austria Corporation Logo"
                class="logo"
            >

            <div class="company-name">

                <h1>Romeo V Austria Corporation</h1>

                <span>
                    INK AND TONER DISTRIBUTOR AND REMANUFACTURER
                </span>

            </div>

        </div>

    </div>

</header>


<!-- =========================================================
     LOGIN
     ========================================================= -->

<section class="py-5">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-md-6 col-lg-4">

                <div class="card shadow border-0">

                    <div class="card-body p-4 p-md-5">

                        <div class="text-center mb-4">

                            <i
                                class="bi bi-person-circle"
                                style="font-size:60px;color:#174ea6;"
                            ></i>

                            <h2 class="mt-3">
                                Welcome Back
                            </h2>

                            <p class="text-muted">
                                Login to your Romeo V Austria Corporation account
                            </p>

                        </div>


                        <!-- LOGIN FORM -->

                        <form id="loginForm">


                            <!-- EMAIL -->

                            <div class="mb-3">

                                <label
                                    for="email"
                                    class="form-label fw-bold"
                                >
                                    Email Address
                                </label>

                                <input
                                    type="email"
                                    id="email"
                                    class="form-control"
                                    placeholder="Enter your email"
                                    required
                                >

                            </div>


                            <!-- PASSWORD -->

                            <div class="mb-3">

                                <label
                                    for="password"
                                    class="form-label fw-bold"
                                >
                                    Password
                                </label>

                                <input
                                    type="password"
                                    id="password"
                                    class="form-control"
                                    placeholder="Enter your password"
                                    required
                                >

                            </div>


                            <!-- MESSAGE -->

                            <div
                                id="loginMessage"
                                class="mb-3"
                            ></div>


                            <!-- LOGIN BUTTON -->

                            <div class="d-grid">

                                <button
                                    type="submit"
                                    class="btn btn-primary btn-lg"
                                    id="loginButton"
                                >

                                    <i class="bi bi-box-arrow-in-right"></i>

                                    Login

                                </button>

                            </div>


                        </form>


                        <!-- REGISTER -->

                        <div class="text-center mt-4">

                            <p class="mb-1">
                                Don't have an account?
                            </p>

                            <a
                                href="register.html"
                                class="fw-bold"
                            >
                                Create an Account
                            </a>

                        </div>


                        <!-- BACK -->

                        <div class="text-center mt-3">

                            <a href="index.html">
                                <i class="bi bi-arrow-left"></i>
                                Back to Home
                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>


<!-- =========================================================
     SUPABASE
     ========================================================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

// =========================================================
// SUPABASE CONFIGURATION
// =========================================================

// We will put your Supabase information here
// after your Supabase project is ready.

const SUPABASE_URL =
    "YOUR_SUPABASE_URL";

const SUPABASE_ANON_KEY =
    "YOUR_SUPABASE_ANON_KEY";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


// =========================================================
// LOGIN
// =========================================================

document
    .getElementById("loginForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();


        const email =
            document
                .getElementById("email")
                .value
                .trim();


        const password =
            document
                .getElementById("password")
                .value;


        const button =
            document.getElementById("loginButton");


        const message =
            document.getElementById("loginMessage");


        button.disabled = true;

        button.innerHTML =
            '<i class="bi bi-hourglass-split"></i> Logging in...';


        message.innerHTML = "";


        try {

            const { data, error } =
                await supabaseClient.auth.signInWithPassword({

                    email: email,
                    password: password

                });


            if (error) {

                throw error;

            }


            message.innerHTML = `

                <div class="alert alert-success">

                    <i class="bi bi-check-circle"></i>

                    Login successful!

                </div>

            `;


            setTimeout(function() {

                window.location.href =
                    "index.html";

            }, 1000);


        } catch (error) {

            message.innerHTML = `

                <div class="alert alert-danger">

                    <i class="bi bi-exclamation-circle"></i>

                    ${error.message}

                </div>

            `;


            button.disabled = false;

            button.innerHTML =
                '<i class="bi bi-box-arrow-in-right"></i> Login';

        }

    });

</script>


</body>

</html>
